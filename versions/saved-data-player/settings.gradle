pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'shared-lootr-saved-data-1.21.1'

def selectedLoader = providers.gradleProperty('loader').getOrElse('all')
if (selectedLoader == 'all' || selectedLoader == 'fabric') include 'fabric'
if (selectedLoader == 'all' || selectedLoader == 'neoforge') include 'neoforge'
