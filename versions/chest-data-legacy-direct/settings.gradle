pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'shared-lootr-chest-data-legacy-direct'

def selectedLoader = providers.gradleProperty('loader').getOrElse('all')
if (selectedLoader == 'all' || selectedLoader == 'fabric') include 'fabric'
if (selectedLoader == 'all' || selectedLoader == 'forge') include 'forge'
