plugins {
    id 'fabric-loom'
}

base {
    archivesName = 'shared_lootr-fabric-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}


loom {
    runs {
        server {
            server()
            runDir 'run'
            programArg '--nogui'
        }
    }
}

apply from: rootProject.file('../sources.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation lootrCoordinate
    modRuntimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    modCompileOnly "maven.modrinth:jade:${jade_fabric_version}"
    modRuntimeOnly "maven.modrinth:jade:${jade_fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
