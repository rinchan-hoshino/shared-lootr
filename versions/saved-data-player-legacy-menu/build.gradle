plugins {
    id 'fabric-loom' version '1.14.7' apply false
    id 'net.fabricmc.fabric-loom-companion' version '1.14.7'
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

apply from: rootProject.file('../saved-data-profile.gradle')

subprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://maven.shedaniel.me' }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
