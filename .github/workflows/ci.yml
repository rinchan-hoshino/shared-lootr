name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests and build 8-target matrix
        run: python3 scripts/build-matrix.py

      - name: Upload built JARs
        uses: actions/upload-artifact@v4
        with:
          name: shared-lootr-jars
          path: build/dist/*.jar
