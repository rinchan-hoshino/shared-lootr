allprojects {
    afterEvaluate { p ->
        if (p.name == 'neoforge') {
            def probeRoot = new File(System.getProperty('probe.sources'))
            def probe = p.sourceSets.create('runtimeProbe') {
                java.srcDir new File(probeRoot, 'java')
                java.srcDir new File(probeRoot.parentFile, 'players-' + System.getProperty('probe.players', 'modern') + '/java')
                java.srcDir new File(probeRoot.parentFile, 'neoforge/java')
                resources.srcDir new File(probeRoot.parentFile,
                        p.rootProject.minecraft_version == '1.20.4' ? 'neoforge-legacy/resources' : 'neoforge/resources')
                compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
                runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            }
            p.neoForge.mods.create('shared_lootr_probe') { sourceSet(probe) }
            p.neoForge.runs.server {
                gameDirectory = p.file(System.getProperty('probe.instance'))
                if (p.rootProject.minecraft_version == '1.20.4') {
                    environment 'MOD_CLASSES', [
                        'shared_lootr': p.sourceSets.main,
                        'shared_lootr_probe': probe
                    ].collectMany { id, sources ->
                        (sources.output.classesDirs.files + sources.output.resourcesDir).collect { "${id}%%${it}" }
                    }.join(File.pathSeparator)
                }
            }
        }
    }
}
