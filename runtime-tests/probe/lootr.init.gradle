// Override only the test dependency; release builds retain their pinned Lootr version.
allprojects {
    beforeEvaluate { p ->
        p.configurations.configureEach {
            resolutionStrategy.eachDependency { dependency ->
                if (dependency.requested.group == 'maven.modrinth' && dependency.requested.name == 'lootr') {
                    dependency.useVersion(System.getProperty('probe.lootrVersion'))
                }
            }
        }
    }
}
