plugins { id 'base' }

tasks.register('sourceContracts', Exec) {
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tests', '-v'
}
check.dependsOn sourceContracts

tasks.register('buildMatrix', Exec) {
    def args = ['python3', 'tools/build_matrix.py']
    if (project.hasProperty('profile')) args += ['--profile', project.property('profile')]
    if (project.hasProperty('loader')) args += ['--loader', project.property('loader')]
    if (project.hasProperty('jobs')) args += ['--jobs', project.property('jobs')]
    commandLine args
}
assemble.dependsOn buildMatrix
