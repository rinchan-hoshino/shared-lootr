plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

def root = rootProject
def modId = root.property('mod_id')
def apiLayer = root.api_layer
def resolverLayer = root.resolver_layer
def enableE2eGameTest = root.minecraft_version == '1.21.1'

base {
    archivesName = "${modId}-neoforge"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.java.srcDir root.file("common/src/${apiLayer}/java")
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir root.file("common/src/${apiLayer}/resources")
if (resolverLayer != apiLayer) {
    sourceSets.main.java.srcDir root.file("common/src/${resolverLayer}/java")
    sourceSets.main.resources.srcDir root.file("common/src/${resolverLayer}/resources")
}
sourceSets.test.java.srcDir root.file('common/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

if (enableE2eGameTest) {
    sourceSets {
        e2e {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
}

sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.minecraft_version_range,
        neo_version_range      : root.neo_version_range,
        loader_version_range   : root.property('loader_version_range'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description'),
        lootr_version          : root.lootr_version,
        icon_property          : root.minecraft_version == '26.2' ? 'iconFile' : 'logoFile'
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

def e2eRunDir = layout.buildDirectory.dir('e2e-run')

if (enableE2eGameTest) {
    tasks.register('preparePackagedE2eMods', Sync) {
        dependsOn tasks.named('jar')
        from(tasks.named('jar').flatMap { it.archiveFile })
        into e2eRunDir.map { it.dir('mods') }
    }
}

neoForge {
    version = root.neo_version
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
        if (enableE2eGameTest) {
            shared_lootr_e2e {
                sourceSet(sourceSets.e2e)
            }
        }
    }
    unitTest {
        enable()
        testedMod = mods."${modId}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        if (enableE2eGameTest) {
            e2eGameTestServer {
                type = 'gameTestServer'
                gameDirectory = e2eRunDir
                loadedMods = [mods.shared_lootr_e2e]
                systemProperty 'forge.enabledGameTestNamespaces', 'shared_lootr_e2e'
                systemProperty 'neoforge.enabledGameTestNamespaces', 'shared_lootr_e2e'
                systemProperty 'sharedlootr.e2e.expectedJar', "${modId}-neoforge-${project.version}.jar"
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

if (enableE2eGameTest) {
    tasks.matching { it.name == 'runE2eGameTestServer' }.configureEach {
        dependsOn tasks.named('preparePackagedE2eMods')
    }
    tasks.named('check') {
        dependsOn tasks.named('runE2eGameTestServer')
    }
}

dependencies {
    implementation "maven.modrinth:lootr:${root.lootr_neoforge_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    doFirst {
        systemProperty 'sharedlootr.verify.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'sharedlootr.project.root', root.projectDir.absolutePath
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
