modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "shared_lootr.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lootr"
type="required"
versionRange="${lootr_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rinlib"
type="required"
versionRange="${rinlib_version_range}"
ordering="BEFORE"
side="BOTH"
